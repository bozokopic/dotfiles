{
    "position": "top",
    "modules-left": ["niri/workspaces"],
    "modules-center": ["niri/window"],
    "modules-right": ["network", "pulseaudio", "battery", "clock", "tray"],

    "niri/workspaces": {
        "sort-by-name": true,
        "display-condition": "only-populated"
    },

    "niri/window": {
        "separate-outputs": true
    },

    "include": [
        "~/.config/waybar/default.conf"
    ]
}
