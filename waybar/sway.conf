{
    "position": "top",
    "modules-left": ["sway/workspaces"],
    "modules-center": ["sway/window"],
    "modules-right": ["network", "pulseaudio", "battery", "clock", "tray"],

    "sway/workspaces": {
        "format": "{name}"
    },

    "include": [
        "~/.config/waybar/default.conf"
    ]
}
